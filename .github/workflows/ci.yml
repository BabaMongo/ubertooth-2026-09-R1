name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake libusb-1.0-0-dev libpcap-dev python3-dev cppcheck clang-tidy

    - name: Configure CMake
      run: |
        cd host
        cmake . -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: |
        cd host
        make -j$(nproc)

    - name: Run cppcheck
      run: |
        cppcheck --project=host/compile_commands.json \
                 --enable=all \
                 --suppress=missingIncludeSystem \
                 --error-exitcode=1 \
                 host/
      continue-on-error: true

    - name: Run clang-tidy
      run: |
        cd host
        clang-tidy -p . host/ubertooth-tools/src/*.c || true
      continue-on-error: true

    - name: Memory check with valgrind
      run: |
        sudo apt-get install -y valgrind
        cd host
        valgrind --leak-check=full --show-leak-kinds=all \
                 ./ubertooth-tools/src/ubertooth-util --help || true
      continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Run Semgrep
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/owasp-top-ten
          p/cwe-top-25
      continue-on-error: true
